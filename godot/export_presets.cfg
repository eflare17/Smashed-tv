<script>
// a line along the bottom of the page while the game loads (the game says each start-up step: VoxelArena._boot), and any
// error the page throws: a phone that stops shows where, without a computer plugged in
(function(){
  function say(t){
    var d=document.getElementById('bootMsg');
    if(!d){d=document.createElement('div');d.id='bootMsg';d.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:60;color:#f7a8ff;font:600 13px sans-serif;text-align:center;pointer-events:none;text-shadow:0 0 4px #000,0 0 2px #000';(document.body||document.documentElement).appendChild(d);}
    d.textContent=t;
  }
  window.smashedSay=say;
  addEventListener('error',function(e){say('Error: '+(e.message||e.type));});
  addEventListener('unhandledrejection',function(e){var m=String((e.reason&&e.reason.message)||e.reason);if(/Pointer Lock|AudioContext|fullscreen/i.test(m))return;say('Error: '+m);});
  function first(){say('Loading the game (60 MB the first time) ...');}
  if(document.body)first();else addEventListener('DOMContentLoaded',first);
})();
</script>
