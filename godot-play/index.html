<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Smashed TV</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none}
@supports(height:100dvh){html,body{height:100dvh}}
#canvas{position:fixed!important;left:0!important;top:0!important;width:100%!important;height:100%!important;display:block}
#fsBtn{position:fixed;left:max(8px,env(safe-area-inset-left));top:calc(60px + env(safe-area-inset-top));z-index:5;display:none;padding:5px 10px;font:600 12px sans-serif;color:#f7a8ff;background:rgba(20,12,28,.55);border:1.5px solid #f7a8ff;border-radius:14px;opacity:.7;-webkit-tap-highlight-color:transparent}
#fsBtn:active{opacity:1}
</style>
<script>
(function(){
  var de=document.documentElement;
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  var touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  var canFs=!!(de.requestFullscreen||de.webkitRequestFullscreen);
  function mk(){
    var standalone=(navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
    if(!touch||!canFs||standalone)return;
    var b=document.createElement('button');b.id='fsBtn';b.type='button';b.textContent='FULL SCREEN';
    function sync(){b.style.display=(isFs()||window.smashedFsHidden)?'none':'block';}
    window.smashedFsHide=function(h){window.smashedFsHidden=!!h;sync();};
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:'hide'});
      if(p&&p.then)p.then(function(){try{if(screen.orientation&&screen.orientation.lock&&innerWidth>innerHeight)screen.orientation.lock('landscape').catch(function(){});}catch(_){}} ).catch(function(){});
    });
    ['touchstart','touchend','pointerdown','pointerup'].forEach(function(n){b.addEventListener(n,function(e){e.stopPropagation();},{passive:true});});
    document.body.appendChild(b);sync();
    document.addEventListener('fullscreenchange',function(){sync();dispatchEvent(new Event('resize'));});
    document.addEventListener('webkitfullscreenchange',function(){sync();dispatchEvent(new Event('resize'));});
  }
  if(document.body)mk();else addEventListener('DOMContentLoaded',mk);
  // follow the visible viewport (an address bar sliding away changes it without a resize on some browsers)
  if(window.visualViewport)visualViewport.addEventListener('resize',function(){dispatchEvent(new Event('resize'));});
  // a web app manifest (built here so it points at wherever the game is served): Add to Home Screen opens it full screen
  try{
    var m={name:'Smashed TV',short_name:'Smashed TV',start_url:location.href.split('#')[0],scope:location.href.replace(/[^\/]*$/,''),
      display:'fullscreen',orientation:'any',background_color:'#000000',theme_color:'#000000',
      icons:[{src:new URL('index.icon.png',location.href).href,sizes:'256x256',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(_){}
})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10190368,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
