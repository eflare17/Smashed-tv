html, body, #canvas {
	margin: 0;

	color: white;

	max-height: 100%;

	margin: auto;
}

	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;

#status-notice {

<script>
(function(){
  var de=document.documentElement;
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  var touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  var canFs=!!(de.requestFullscreen||de.webkitRequestFullscreen);
  function mk(){
    var standalone=(navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
    if(!touch||!canFs||standalone)return;
    var b=document.createElement('button');b.id='fsBtn';b.type='button';b.textContent='FULL SCREEN';
    function sync(){b.style.display=(isFs()||window.smashedFsHidden)?'none':'block';}
    window.smashedFsHide=function(h){window.smashedFsHidden=!!h;sync();};
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:'hide'});
      if(p&&p.then)p.then(function(){try{if(screen.orientation&&screen.orientation.lock&&innerWidth>innerHeight)screen.orientation.lock('landscape').catch(function(){});}catch(_){}} ).catch(function(){});
    });
    ['touchstart','touchend','pointerdown','pointerup'].forEach(function(n){b.addEventListener(n,function(e){e.stopPropagation();},{passive:true});});
    document.body.appendChild(b);sync();
    document.addEventListener('fullscreenchange',function(){sync();dispatchEvent(new Event('resize'));});
    document.addEventListener('webkitfullscreenchange',function(){sync();dispatchEvent(new Event('resize'));});
  }
  if(document.body)mk();else addEventListener('DOMContentLoaded',mk);
  // follow the visible viewport (an address bar sliding away changes it without a resize on some browsers)
  if(window.visualViewport)visualViewport.addEventListener('resize',function(){dispatchEvent(new Event('resize'));});
  // a web app manifest (built here so it points at wherever the game is served): Add to Home Screen opens it full screen
  try{
    var m={name:"Dozer Drive",short_name:"Dozer Drive",start_url:location.href.split('#')[0],scope:location.href.replace(/[^\/]*$/,''),
      display:'fullscreen',orientation:'any',background_color:'#000000',theme_color:'#000000',
      icons:[{src:new URL('index.icon.png',location.href).href,sizes:'256x256',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(_){}
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"../godot-play/index","mainPack":"game-81602172.pck","experimentalVK":false,"fileSizes":{"game-81602172.pck":931456,"../godot-play/index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// the download takes the bar to 90%, the phone getting the game going afterwards the rest of the way. The time left
		// is the download's, from its speed over the last few seconds, plus a guess at the start-up (the browser gives no
		// measure of that). Seconds shown only once there's a speed to go on, and rounded so it doesn't flicker.
		const START_UP_S = 5;
		const fill = document.getElementById('load-fill');
		const big = document.getElementById('load-big');
		const small = document.getElementById('load-small');
		const samples = [];
		let startedAt = 0;
		let lastShown = -1;
		let lastShownAt = 0;
		let doneAt = 0;
		let creep = 0;

		function roughly(s) {
			if (s < 10) return 'Less than 10 seconds left';
			if (s < 60) return 'About ' + Math.round(s / 5) * 5 + ' seconds left';
			if (s < 90) return 'About a minute left';
			return 'About ' + Math.round(s / 60) + ' minutes left';
		}

		function setBar(p) {
			fill.style.width = Math.min(100, p).toFixed(1) + '%';
		}

		function gettingReady() {
			if (!initializing) return;
			// creeps on towards 100 without getting there, so it never looks stuck
			creep = 90 + 9.5 * (1 - Math.exp(-(performance.now() - doneAt) / 4000));
			setBar(creep);
			big.textContent = Math.floor(creep) + '%';
			small.textContent = 'Nearly there: warming up the machines…';
			requestAnimationFrame(gettingReady);
		}

		engine.startGame({
			'onProgress': function (current, total) {
				if (!(current > 0 && total > 0)) return;
				const now = performance.now();
				if (!startedAt) startedAt = now;
				if (current >= total) {
					if (!doneAt) {
						doneAt = now;
						gettingReady();
					}
					return;
				}
				const pct = 100 * current / total;
				setBar(pct * 0.9);
				big.textContent = Math.floor(pct * 0.9) + '%';
				samples.push([now, current]);
				while (samples.length > 2 && now - samples[0][0] > 4000) samples.shift();
				const span = (now - samples[0][0]) / 1000;
				const mb = (n) => (n / 1048576).toFixed(0);
				let text = mb(current) + ' of ' + mb(total) + ' MB';
				if (span > 1 && now - startedAt > 1500 && current > samples[0][1]) {
					const speed = (current - samples[0][1]) / span;
					const left = (total - current) / speed + START_UP_S;
					if (lastShown < 0 || now - lastShownAt > 1000) {
						lastShown = left;
						lastShownAt = now;
					}
					text = roughly(lastShown) + '  ·  ' + text;
				} else {
					text = 'Working out how long…  ·  ' + text;
				}
				small.textContent = text;
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
